<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuizArena — Tug of War Redesign Preview</title><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/tug-war.css"><style>body{background:#f5f3fc}.preview-wrap{max-width:1140px;padding:32px 24px;margin:auto}.preview-title{color:#29234a}.preview-title h1{font-size:36px;margin:0}.preview-title p{margin:7px 0 24px;color:#6e6484}.preview-grid{display:grid;grid-template-columns: minmax(0,1fr) 310px;gap:25px}.preview-side{display:grid;gap:20px}.preview-side .mode{padding:18px}.preview-side .card{padding:22px}.preview-side .guest-toggle-row{margin-top:12px}@media(max-width:780px){.preview-grid{grid-template-columns:1fr}.preview-wrap{padding:20px 12px}.preview-title h1{font-size:26px}}</style></head><body><div class="preview-wrap"><div class="preview-title"><p>QUIZARENA • DESIGN PREVIEW</p><h1>NEW Tug of War Arena</h1><p>Illustrated two-team stadium, live rope position, and anonymous join control.</p></div><div class="preview-grid"><div id="demo"></div><aside class="preview-side"><article class="card mode mode-tug"><div class="tug-card-visual"><img src="../assets/tug-player-purple.svg" alt=""><img src="../assets/tug-player-teal.svg" alt=""><span class="tug-card-vs">VS</span></div><h3>Tug of War Quiz</h3><p class="mode-description">Two teams. Every correct answer pulls the rope!</p><button class="btn">Choose mode →</button></article><section class="card"><h3>Hosting settings</h3><label class="guest-toggle-row"><span class="guest-toggle-copy"><strong>Allow anonymous players</strong><small>Students join with a PIN and nickname.</small></span><input type="checkbox" checked role="switch" aria-label="Allow anonymous players"></label></section></aside></div></div><script type="module">import{tugStage}from '../js/tug-war.js';document.getElementById('demo').innerHTML=tugStage({id:'preview',mode:'tug',tug_position:24,status:'reveal',question_index:3,question_count:10,tug_rounds:[{left_correct:9,left_total:12,right_correct:6,right_total:12}]},[{team:1},{team:1},{team:1},{team:1},{team:2},{team:2},{team:2}]);</script></body></html>
